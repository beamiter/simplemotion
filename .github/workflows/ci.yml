name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: simplemotion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vim:
    name: Vim 9.1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out tested SimpleWhichKey revision
        uses: actions/checkout@v4
        with:
          repository: beamiter/simplewhichkey
          ref: 86e75d0bce8e1d3a35915c887c52a226241b0c2a
          path: .deps/simplewhichkey

      # vim-nox rather than the minimal build: the suite compiles every :def
      # ahead of time and drives real popups and terminals, none of which the
      # tiny build has.
      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install --yes vim-nox
          vim --version

      # Pin the companion fix so this gate is reproducible before/after merge.
      # Updating the pin must run both plugins together again.
      - name: Run the quality gate
        env:
          SIMPLEWHICHKEY_ROOT: ${{ github.workspace }}/.deps/simplewhichkey
        run: make check-integration

      - name: Validate help tags
        run: >-
          vim -Nu NONE -n -i NONE -es
          -c 'set nomore'
          -c 'helptags doc'
          -c 'qa!'
